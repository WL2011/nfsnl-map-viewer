<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFSNL 赛道图鉴</title>
<style>
:root{
  color-scheme: light;
  --bg:#f1ede4; --panel:#faf8f3; --panel-2:#ece7dc; --scene:#ebe6db;
  --ink:#1d1c19; --ink-2:#55524a; --muted:#8b877c; --line:#d8d2c4; --line-soft:#e5e0d5;
  --accent:#d9480f; --accent-ink:#ffffff; --accent-soft:rgba(217,72,15,.12); --accent-line:rgba(217,72,15,.55);
  --grid-dot:#bab3a2; --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 20px rgba(40,30,10,.07);
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#0f1114; --panel:#171a1f; --panel-2:#1f232a; --scene:#121418;
    --ink:#ecebe6; --ink-2:#b8b5ab; --muted:#7f7c73; --line:#2b3038; --line-soft:#222630;
    --accent:#ff7b3a; --accent-ink:#1a0d05; --accent-soft:rgba(255,123,58,.14); --accent-line:rgba(255,123,58,.6);
    --grid-dot:#3a404b; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0f1114; --panel:#171a1f; --panel-2:#1f232a; --scene:#121418;
  --ink:#ecebe6; --ink-2:#b8b5ab; --muted:#7f7c73; --line:#2b3038; --line-soft:#222630;
  --accent:#ff7b3a; --accent-ink:#1a0d05; --accent-soft:rgba(255,123,58,.14); --accent-line:rgba(255,123,58,.6);
  --grid-dot:#3a404b; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:252px minmax(0,1fr) 304px;height:100vh}

/* ---------- left: map index */
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;padding:16px 14px 12px}
.brand .logo{width:30px;height:30px;flex:none;border-radius:8px;background:var(--ink);display:grid;place-items:center}
.brand .logo svg{width:20px;height:20px}
.brand .name{font-weight:700;font-size:15px;letter-spacing:.5px}
.brand .sub{color:var(--muted);font-size:11px}
.icon-btn{margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--panel-2)}
.icon-btn svg{width:16px;height:16px}
.search{padding:0 14px 10px}
.search input{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.search input::placeholder{color:var(--muted)}
#maps{flex:1;overflow:auto;padding:0 8px 12px}
.grp{margin-top:8px}
.grp-h{display:flex;align-items:center;gap:8px;padding:6px 6px 4px;color:var(--ink);font-weight:600}
.grp-h .n{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.item{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:8px 8px;border-radius:8px;cursor:pointer;color:var(--ink);margin-top:2px}
.item:hover{background:var(--panel-2)}
.item .n{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;flex:none}
.item .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.item[aria-current="true"] .n{color:var(--bg);border-color:var(--bg);opacity:.8}
.item .len{margin-left:auto;color:var(--muted);font-family:var(--mono);font-size:11.5px;white-space:nowrap;flex:none}
.item[aria-current="true"]{background:var(--ink);color:var(--bg)}
.item[aria-current="true"] .len{color:var(--bg);opacity:.75}
.side .foot{padding:10px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px}

/* ---------- centre */
.main{display:grid;grid-template-rows:auto minmax(0,1fr) 200px;min-width:0;min-height:0}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.regnum{width:52px;height:52px;border-radius:12px;border:2px solid var(--ink);display:grid;place-items:center;font:700 22px/1 var(--mono);letter-spacing:-1px;flex:none}
.ttl .kicker{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.ttl h1{margin:0;font-size:24px;line-height:1.15;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:var(--panel);font-size:12px;white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.chip.ev{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.facts{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;background:var(--panel-2);padding:3px;border-radius:9px}
.tabs:empty{display:none}
.tab{border:0;background:transparent;padding:4px 10px;border-radius:7px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}

.view{position:relative;min-height:0;background:var(--scene);overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none;transition:opacity .2s}
body.loading #c{opacity:.4}
.float{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.toolbar{left:12px;top:12px;display:flex;flex-direction:column;padding:5px;gap:2px;max-height:calc(100% - 24px);overflow-y:auto;scrollbar-width:none}
.tb{width:38px;min-height:30px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);font-size:11.5px;font-weight:600;padding:0}
.tb:hover{background:var(--panel-2);color:var(--ink)}
.tb svg{width:17px;height:17px}
.tb[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tb[aria-disabled="true"]{opacity:.35;cursor:not-allowed;background:transparent;color:var(--ink-2)}
.tb.wide{font-size:10.5px;line-height:1.15;padding:4px 0;letter-spacing:-.5px;white-space:nowrap}
.tb.go{color:var(--accent)}
.tb.go[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tb-sep{height:1px;background:var(--line);margin:4px 3px;flex:none}
.tb-lbl{font-size:9.5px;color:var(--muted);text-align:center;letter-spacing:1px;padding-top:2px}
.pop{left:62px;top:12px;padding:10px 12px;width:180px}
.pop h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600}
.pop label{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;color:var(--ink-2)}
.pop input{accent-color:var(--accent);margin:0}
.pop .note{color:var(--muted);font-size:11px;margin-top:6px}
.colorkey{right:12px;bottom:12px;padding:10px 12px;width:248px}
.seg{display:flex;background:var(--panel-2);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:6px;padding:3px 6px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.keybar{height:8px;border-radius:2px;margin:10px 0 4px}
.keylbl{display:flex;justify-content:space-between;color:var(--ink-2);font-size:11.5px}
.keylbl span{font-family:var(--mono)}
.gameinfo{color:var(--ink-2);font-size:12px;line-height:1.55}
.gameinfo b{color:var(--ink)}
#tip{position:absolute;pointer-events:none;padding:6px 9px;font-size:12px;display:none;white-space:nowrap;z-index:5;border-radius:8px;line-height:1.45}
#tip b{font-family:var(--mono);font-weight:600}
#tip .k{color:var(--muted)}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--ink-2);padding:20px;pointer-events:none}
#msg div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);max-width:420px}

/* race camera HUD */
.hud{left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100% - 28px));padding:10px 12px 9px;z-index:6}
.hud-row{display:flex;align-items:center;gap:8px}
.hud-row .tb{width:32px}
.hud .unit{color:var(--muted);font-size:11px;margin-left:-4px}
.hud .spacer{flex:1}
.hud input[type=range]{width:100%;accent-color:var(--accent);margin:8px 0 4px}
.hud-stats{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.hud-stats b{color:var(--ink);font-family:var(--mono);font-weight:600}
.hud-stats .big{font:700 20px/1 var(--mono);color:var(--ink)}
.hud .done{color:var(--accent);font-weight:600}
body.driving .colorkey,body.driving #layersPop{display:none}

.prof{border-top:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--panel);outline:none;min-height:0}
.prof-head{display:flex;align-items:baseline;gap:14px;padding:9px 18px 0}
.prof-head .lbl{font-weight:600}
#readout{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#readout b{color:var(--ink);font-family:var(--mono);font-weight:600}
#readout .sep{margin:0 7px;color:var(--line)}
#prof{width:100%;height:100%;display:block;cursor:crosshair}
#prof text{fill:var(--muted);font:10.5px var(--mono)}

/* ---------- right: races */
.races{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.races-head{display:flex;align-items:center;gap:8px;padding:16px 14px 10px}
.races-head h2{margin:0;font-size:15px}
.races-head .cnt{font-family:var(--mono);color:var(--muted);font-weight:400;font-size:12px;margin-left:4px}
.races-head button{border:1px solid var(--line);background:transparent;border-radius:7px;padding:3px 9px;cursor:pointer;color:var(--ink-2)}
.races-head button:hover{background:var(--panel-2)}
.races-head .first{margin-left:auto}
#raceList{list-style:none;margin:0;padding:0 10px 14px;overflow:auto;flex:1}
.race{display:grid;grid-template-columns:auto 1fr auto auto;gap:2px 10px;align-items:center;padding:9px 10px;border-radius:10px;border:1px solid transparent;cursor:pointer;margin-bottom:4px}
.race:hover{background:var(--panel-2)}
.race[aria-selected="true"]{border-color:var(--accent-line);background:var(--accent-soft)}
.race .id{font:600 12px var(--mono);border-radius:6px;padding:2px 6px;background:var(--panel-2);color:var(--ink);display:inline-flex;gap:4px;align-items:center}
.race[aria-selected="true"] .id{background:var(--accent);color:var(--accent-ink)}
.race .id svg{width:11px;height:11px}
.race .len{font:600 13px var(--mono);color:var(--ink)}
.race .clm{font:11.5px var(--mono);color:var(--ink-2);text-align:right}
.race .play{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--accent);padding:0}
.race .play:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.race .play svg{width:10px;height:10px}
.race .spark{grid-column:1/-1;width:100%;height:30px;display:block;margin-top:4px}
.race .span{grid-column:1/-1;font:11px var(--mono);color:var(--muted)}
.race .none{grid-column:1/-1;color:var(--muted)}
.empty{padding:10px 14px;color:var(--muted)}
#mapSelMobile{display:none}

@media (max-width:1180px){
  .app{grid-template-columns:220px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 240px}
  .side{grid-row:1/3}
  .races{grid-column:2;border-left:0;border-top:1px solid var(--line)}
  #raceList{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding-bottom:10px}
  .race{min-width:200px;margin:0}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .races{grid-column:1}
  #mapSelMobile{display:block;width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
  .head{gap:10px}
  .regnum{width:42px;height:42px;font-size:18px}
  .colorkey{width:200px}
  .facts .chip:nth-child(n+3){display:none}
}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="地图">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M3 16c3-1 3.5-5 7-5s3.5-4 7-6" fill="none" stroke="var(--bg)" stroke-width="2.2" stroke-linecap="round"/><circle cx="3" cy="16" r="1.6" fill="var(--accent)"/></svg></div>
      <div><div class="name">赛道图鉴</div><div class="sub">NFS No Limits · 样条线重建</div></div>
      <button class="icon-btn" id="theme" title="切换浅色 / 深色"><svg viewBox="0 0 16 16"><path d="M8 1.5a6.5 6.5 0 1 0 0 13z" fill="currentColor"/><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
    </div>
    <div class="search"><input id="q" type="search" placeholder="搜索地图…" aria-label="搜索地图"></div>
    <nav id="maps"></nav>
    <div class="foot" id="foot">—</div>
  </aside>

  <main class="main">
    <header class="head">
      <select id="mapSelMobile" aria-label="地图"></select>
      <div class="regnum" id="regnum">—</div>
      <div class="ttl"><div class="kicker" id="kicker">—</div><h1 id="place">载入中…</h1></div>
      <span class="chip ev" id="event" hidden></span>
      <div class="facts" id="facts"></div>
      <div class="tabs" id="tracks" role="group" aria-label="路线"></div>
    </header>

    <section class="view" id="stage">
      <canvas id="c" aria-label="赛道三维视图"></canvas>
      <div class="float toolbar" role="toolbar" aria-label="视图">
        <div class="tb-lbl">渲染</div>
        <button class="tb wide" id="rSchem" aria-pressed="true" title="示意图：按数值着色的路面">示意</button>
        <button class="tb wide" id="rGame" aria-pressed="false" title="原赛道：游戏静态场景 + 烘焙光照">原赛道</button>
        <div class="tb-sep"></div>
        <button class="tb" id="m3d" aria-pressed="true" title="三维">3D</button>
        <button class="tb" id="m2d" aria-pressed="false" title="平面俯视图">2D</button>
        <div class="tb-sep"></div>
        <button class="tb" data-view="oblique" title="斜视"><svg viewBox="0 0 18 18"><path d="M2 12l7 4 7-4-7-4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M9 8V2" stroke="currentColor" stroke-width="1.4"/></svg></button>
        <button class="tb" data-view="top" title="俯视"><svg viewBox="0 0 18 18"><rect x="3" y="3" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="9" cy="9" r="1.8" fill="currentColor"/></svg></button>
        <button class="tb" data-view="side" title="侧视"><svg viewBox="0 0 18 18"><path d="M2 14h14M3 12l4-5 3 3 5-6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
        <div class="tb-sep"></div>
        <div class="tb-lbl">高度</div>
        <button class="tb" data-exag="1" title="高度 1×">1×</button>
        <button class="tb" data-exag="2" title="高度夸张 2×">2×</button>
        <button class="tb" data-exag="4" title="高度夸张 4×">4×</button>
        <button class="tb" data-exag="8" title="高度夸张 8×">8×</button>
        <div class="tb-sep"></div>
        <button class="tb go" id="driveBtn" aria-pressed="false" title="比赛镜头：沿选中的比赛（未选则全程）匀速跑一遍"><svg viewBox="0 0 18 18"><path d="M5 3.5v11l9-5.5z" fill="currentColor"/></svg></button>
        <button class="tb" id="flip" aria-pressed="false" title="沿 Z 轴镜像"><svg viewBox="0 0 18 18"><path d="M9 2v14" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 2"/><path d="M7 5L3 13h4zM11 5l4 8h-4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
        <button class="tb" id="reset" title="重置视角"><svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M9 1.5v3M9 13.5v3M1.5 9h3M13.5 9h3" stroke="currentColor" stroke-width="1.4"/></svg></button>
        <button class="tb" id="layersBtn" aria-expanded="false" title="图层"><svg viewBox="0 0 18 18"><path d="M9 2l7 3.5L9 9 2 5.5zM2 9l7 3.5L16 9M2 12.5L9 16l7-3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="float pop" id="layersPop" hidden>
        <h4>图层（示意模式）</h4>
        <label><input type="checkbox" id="lyDrop" checked>落地投影线</label>
        <label><input type="checkbox" id="lyEdge" checked>路面描边</label>
        <label><input type="checkbox" id="lyLanes">比赛车道线</label>
        <label><input type="checkbox" id="lyTraffic">交通车道</label>
        <label><input type="checkbox" id="lyCps" checked>检查点</label>
        <div class="note">原赛道模式只显示游戏场景和起终点图钉。</div>
      </div>
      <div class="float colorkey">
        <div id="keySchem">
          <div class="seg" role="group" aria-label="着色">
            <button data-color="elev" aria-pressed="true">海拔</button>
            <button data-color="grade" aria-pressed="false">坡度</button>
            <button data-color="curve" aria-pressed="false">弯道</button>
          </div>
          <div class="keybar" id="keybar"></div>
          <div class="keylbl"><span id="keyLo">—</span><span id="keyMid"></span><span id="keyHi">—</span></div>
        </div>
        <div id="keyGame" class="gameinfo" hidden></div>
      </div>
      <div class="float hud" id="hud" hidden>
        <div class="hud-row">
          <button class="tb" id="dPlay" title="暂停 / 继续（空格）"><svg viewBox="0 0 18 18" id="dPlayIcon"></svg></button>
          <div class="seg" role="group" aria-label="镜头">
            <button data-dview="chase" aria-pressed="true">追尾</button>
            <button data-dview="cockpit" aria-pressed="false">车内</button>
            <button data-dview="heli" aria-pressed="false">航拍</button>
          </div>
          <div class="seg" role="group" aria-label="车速">
            <button data-speed="120" aria-pressed="false">120</button>
            <button data-speed="200" aria-pressed="true">200</button>
            <button data-speed="300" aria-pressed="false">300</button>
          </div><span class="unit">km/h</span>
          <span class="spacer"></span>
          <button class="tb" id="dExit" title="退出比赛镜头（Esc）"><svg viewBox="0 0 18 18"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        </div>
        <input type="range" id="dProg" min="0" max="1000" value="0" aria-label="进度">
        <div class="hud-stats">
          <span><span class="big" id="hSpeed">200</span> km/h</span>
          <span id="hTitle"></span>
          <span><b id="hDist">0.00</b> / <span id="hLen">0.00</span> km</span>
          <span><b id="hTime">0:00.0</b> / <span id="hTotal">0:00</span></span>
          <span><b id="hElev">0</b> m · <b id="hGrade">0%</b></span>
          <span class="done" id="hDone" hidden>完赛</span>
        </div>
      </div>
      <div id="tip" class="float"></div>
      <div id="msg"><div id="msgText"></div></div>
    </section>

    <section class="prof" id="profile" tabindex="0" aria-label="海拔剖面（左右方向键移动读数）">
      <div class="prof-head"><span class="lbl">海拔剖面</span><span id="readout">悬停路面或剖面查看读数</span></div>
      <svg id="prof" role="img" aria-label="海拔剖面图"></svg>
    </section>
  </main>

    const lens = m.tracks.map(t => km(t.length, 1)).join(' / ');
    const o = document.createElement('option'); o.value = m.key; o.textContent = `${num} ${label} · ${lens} km`; mob.appendChild(o);
    if (q && !`${num} ${m.title} ${m.place} ${m.event} ${m.key}`.toLowerCase().includes(q)) continue;
    const b = document.createElement('button'); b.className = 'item'; b.dataset.key = m.key;
    b.setAttribute('aria-current', String(S.map?.key === m.key));
    const n = document.createElement('span'); n.className = 'n'; n.textContent = num;
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = label;
    const ln = document.createElement('span'); ln.className = 'len'; ln.textContent = m.tracks.length > 1 ? `${m.tracks.length} 条路线` : `${km(m.tracks[0].length, 1)} km`;
    b.append(n, nm, ln); b.addEventListener('click', () => selectMap(m.key));
    nav.appendChild(b);
  }
  if (S.map) mob.value = S.map.key;
  $('#foot').textContent = `${NF.index.length} 张地图 · ${(NF.sceneIndex || []).length} 个原赛道场景`;
}

// ------------------------------------------------------------------ controls wiring
$('#q').addEventListener('input', buildMapList);
$('#mapSelMobile').addEventListener('change', e => selectMap(e.target.value));
$('#m2d').addEventListener('click', () => { stopDrive(); setMode('2d'); });
$('#m3d').addEventListener('click', () => { stopDrive(); setMode('3d'); });
$('#rSchem').addEventListener('click', () => setRender('schem'));
$('#rGame').addEventListener('click', () => { if ($('#rGame').getAttribute('aria-disabled') !== 'true') setRender('game'); });
$('#driveBtn').addEventListener('click', () => DRV.active ? stopDrive() : startDrive());
$('#reset').addEventListener('click', () => { stopDrive(); S.mode === '2d' ? reset2D() : setView(S.view === 'top' || S.view === 'side' ? S.view : 'oblique', true); });
$('#flip').addEventListener('click', () => {
  S.flip = !S.flip; world.scale.z = S.flip ? -1 : 1; $('#flip').setAttribute('aria-pressed', String(S.flip));
  DRV.snap = true; if (S.cursor >= 0 && !DRV.active) setCursor(S.cursor);
});
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { stopDrive(); setView(b.dataset.view, true); }));
function setExag(v, force = false) {
  if (!force && S.render === 'game' && G.gameScene) return;   // the real scene is never stretched
  S.exag = v; exagG.scale.y = v; DRV.snap = true;
  document.querySelectorAll('[data-exag]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.exag === v)));
  if (S.T) placeMarkers();
}
document.querySelectorAll('[data-exag]').forEach(b => b.addEventListener('click', () => setExag(+b.dataset.exag)));
document.querySelectorAll('[data-color]').forEach(b => b.addEventListener('click', () => { S.color = b.dataset.color; recolor(); }));
$('#layersBtn').addEventListener('click', () => {
  const pop = $('#layersPop'); pop.hidden = !pop.hidden; $('#layersBtn').setAttribute('aria-expanded', String(!pop.hidden));
});
['#lyDrop', '#lyEdge', '#lyLanes', '#lyTraffic', '#lyCps'].forEach(id => $(id).addEventListener('change', applyLayers));
function applyTheme() { if (S.T) { build3D(); buildRaces(); buildProfile(); } else updateKey(); }
$('#theme').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('nfsnl-theme', next); } catch (e) {}
  applyTheme();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!document.documentElement.dataset.theme) applyTheme(); });

// ------------------------------------------------------------------ boot
let last = performance.now();
window.__nfsnl = {DRV, car, persp};                         // debug hook (used by the automated smoothness test)
(function loop(t) {
  requestAnimationFrame(loop);
  // frame timestamp step: the drive keeps its speed even when the frame rate drops (capped after a stall / hidden tab)
  const now = t ?? performance.now(), dt = Math.max(0, Math.min(0.25, (now - last) / 1000)); last = now;
  if (DRV.active && S.T) driveStep(dt);
  else {
    if (tween) {
      const k = Math.min(1, (now - tween.t0) / 550), e = 1 - (1 - k) ** 3;
      persp.position.lerpVectors(tween.p0, tween.p1, e); ctl3.target.lerpVectors(tween.t0v, tween.t1v, e);
      if (k >= 1) tween = null;
    }
    ctl().update(); doHover();
  }
  renderer.render(scene, cam());
})();

setExag(1, true);
setPlayIcon();
if (!NF.index || !NF.index.length) {
  showMsg('找不到赛道数据（data/index.js）。请先运行：python3 tools/export_tracks.py');
  $('#place').textContent = '没有数据';
} else {
  buildMapList();
  try { if (localStorage.getItem('nfsnl-render') === 'game' && NF.sceneIndex) { S.render = 'game'; $('#rSchem').setAttribute('aria-pressed', 'false'); $('#rGame').setAttribute('aria-pressed', 'true'); } } catch (e) {}
  if (!NF.sceneIndex) $('#rGame').setAttribute('aria-disabled', 'true');
  let h = location.hash.slice(1);
  if (!h) { try { h = (localStorage.getItem('nfsnl-track-viewer') || '').slice(1); } catch (e) {} }
  const [hk, ht, hr] = decodeURIComponent(h).split('/');
  const start = NF.index.find(m => m.key === hk) || NF.index.find(m => m.key === 'final_region08_mountain') || NF.index[0];
  selectMap(start.key, start.key === hk ? +ht || 0 : 0, start.key === hk && hr !== undefined ? +hr : -1);
}
</script>
